name: emily.cli CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: emily-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_build_construct:
    name: 🔨 Test, Build & Construct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Build emily binary
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o emily .
          ./emily --version

      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail

          # version check
          VERSION=$(./emily --version 2>&1)
          if [[ "$VERSION" != emily\ * ]]; then
            echo "FAIL: --version output unexpected: $VERSION"
            exit 1
          fi
          echo "version: $VERSION"

          # observe dry-run
          OUT=$(./emily observe --dry-run "ci-probe" 2>&1)
          if [[ "$OUT" != *"ci-probe"* ]]; then
            echo "FAIL: observe --dry-run output unexpected: $OUT"
            exit 1
          fi
          echo "observe --dry-run: OK"

          # apples get bad id (must exit non-zero)
          if ./emily apples get notanumber 2>/dev/null; then
            echo "FAIL: apples get <non-numeric> should exit non-zero"
            exit 1
          fi
          echo "apples get bad-id: OK (non-zero exit)"

          # help works
          OUT=$(./emily help observe 2>&1)
          if [[ "$OUT" != *"emily observe"* ]]; then
            echo "FAIL: help observe unexpected"
            exit 1
          fi
          echo "help observe: OK"

      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="EMILY_CLI_CONSTRUCT.txt"
          {
            echo "EMILY CLI CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './vendor' \
                -o -path './dist' \
                -o -path './build' \
                -o -path './artifacts' \
                -o -path './tmp' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.go' -o -name '*.mod' -o -name '*.sum' -o \
                -name '*.md' -o -name '*.txt' -o -name '*.sh' -o \
                -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o \
                -name 'Makefile' -o -name '.gitignore' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emily-cli-${{ github.run_number }}-${{ github.sha }}
          path: |
            emily
            EMILY_CLI_CONSTRUCT.txt
          if-no-files-found: error

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same
  # exact pattern PITVIPER's own ci.yml established (2026-08-21), also just applied to SHANKPIT/
  # shankpit-460/REDGARDEN/GoblinFoxDragon this same session: auto-bumps MINOR version only on
  # every real push to main (never PRs, never the tag-push this job's own release step triggers),
  # major stays a human call. A REAL release (no --prerelease flag). Unlike the SDL2/mingw game
  # clients above, this repo never built more than a single native linux/amd64 binary for CI --
  # a real operator CLI with no distributable release at all otherwise, so this cross-compiles
  # the 3 platforms Go can trivially target with no external toolchain (linux/amd64, darwin/
  # arm64, windows/amd64) rather than just reusing test_build_construct's own single-platform
  # binary.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [test_build_construct]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version;
      # actions/checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" out="$3"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "dist/$out" .
          }
          # linux/amd64 + darwin only -- this is an operator CLI for managing this specific Linux
          # box, and the source uses real Unix-only syscalls unconditionally (syscall.SYS_IOCTL,
          # SysProcAttr.Setsid in cmd/chat.go/gpt2.go/start.go, no //go:build guard), confirmed by
          # a real local cross-compile attempt -- Windows was never a meaningful target here and
          # fixing that source gap is a separate, real change, not attempted in this CI-only pass.
          build linux amd64 emily-linux-amd64
          build darwin arm64 emily-darwin-arm64
          build darwin amd64 emily-darwin-amd64
          tar -czf dist/emily-linux-amd64.tar.gz -C dist emily-linux-amd64
          tar -czf dist/emily-darwin-arm64.tar.gz -C dist emily-darwin-arm64
          tar -czf dist/emily-darwin-amd64.tar.gz -C dist emily-darwin-amd64

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            dist/emily-linux-amd64.tar.gz \
            dist/emily-darwin-arm64.tar.gz \
            dist/emily-darwin-amd64.tar.gz \
            --title "$NEXT_VERSION" \
            --generate-notes
